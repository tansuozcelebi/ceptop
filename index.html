<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>ceptop 🎱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0b0f1a;
      font-family: -apple-system, system-ui, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; }

    #hud {
      position: fixed; top: 10px; left: 10px;
      color: #8ab4ff; font-size: 12px;
      background: rgba(10, 15, 30, .55);
      border: 1px solid rgba(138, 180, 255, .25);
      border-radius: 8px;
      padding: 8px 10px;
      pointer-events: none;
      line-height: 1.5;
      z-index: 10;
    }

    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      background: rgba(5, 8, 16, .85);
      backdrop-filter: blur(6px);
      z-index: 20;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { color: #fff; font-size: 28px; }
    #overlay p { color: #9fb3d9; font-size: 14px; text-align: center; max-width: 300px; }
    #enableSensors {
      background: #3b82f6; color: #fff;
      border: none; border-radius: 12px;
      padding: 14px 28px; font-size: 17px; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(59, 130, 246, .5);
    }
    #enableSensors:active { transform: scale(.96); }
  </style>

  <!-- CDN import map: build aracı gerekmez -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <div>eğim X: <span id="tiltX">0.0</span>°</div>
    <div>eğim Z: <span id="tiltZ">0.0</span>°</div>
    <div>kaynak: <span id="src">—</span></div>
  </div>

  <div id="overlay">
    <h1>🎱 ceptop</h1>
    <p>Telefonu eğerek topu hareket ettir. iOS'ta sensör izni butona basarak verilir.</p>
    <button id="enableSensors">Sensörleri Etkinleştir</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
